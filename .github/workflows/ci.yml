name: CivicResolve Security & Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 for Firebase Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint & Firestore Rules security check
        run: npm run lint

      - name: Unit, integration, accessibility & security test suite
        run: npm test

      - name: Firestore Emulator rules regression suite
        run: npx firebase-tools emulators:exec --only firestore "npx vitest run tests/firestore.emulator.test.ts"

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

      - name: Production Vite build
        run: npm run build
