name: CivicResolve Security & Quality CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: civicresolve-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain
        run: |
          node --version
          bun --version
          java -version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint and Firestore Rules security check
        run: bun run lint

      - name: Unit, integration, accessibility and security tests
        run: bun run test

      - name: Unit tests
        run: bun run test:unit

      - name: Integration and security tests
        run: bun run test:integration && bun run test:security

      - name: Test coverage
        run: bun run test:coverage

      - name: Firestore Emulator rules regression suite
        run: bun run test:emulator

      - name: Dependency vulnerability audit
        run: bun audit

      - name: Production Vite build
        run: bun run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicresolve-coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
